name: pr-checklist-gate

on:
  push:
    branches: [copilot/sb688-public-master-hardened]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-pr-checklist:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate required PR checklist items are checked
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          let body = process.env.PR_BODY || "";
          const required = [
            "npm run build passes in CI",
            "npm test passes in CI",
            "npm run demo runs end-to-end without errors in CI",
            "Brain remains adapter-only",
            "Audit ledger format remains append-only and hash-chained",
            "Evidence labels in `docs/WHITEPAPER.md` were not weakened"
          ];

          if (!body.trim()) {
            const { execFileSync } = require("node:child_process");
            try {
              body = execFileSync("gh", ["pr", "list", "--state", "open",
                "--head", process.env.PR_BRANCH, "--json", "body",
                "--jq", ".[0].body"], { encoding: "utf8",
                env: { ...process.env, GH_TOKEN: process.env.GH_TOKEN } });
            } catch {
              console.error("Could not retrieve the open PR body for this branch.");
              process.exit(1);
            }
          }
          if (!body.trim()) {
            console.error("PR body is empty; required checklist items are missing.");
            process.exit(1);
          }

          const missing = required.filter((item) => {
            const escaped = item.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const checked = new RegExp(`-\\s*\\[x\\]\\s*.*${escaped}`, "i");
            return !checked.test(body);
          });

          if (missing.length > 0) {
            console.error("Missing checked PR checklist items:");
            for (const item of missing) console.error(` - ${item}`);
            process.exit(1);
          }

          console.log("PR checklist gate passed.");
          NODE
